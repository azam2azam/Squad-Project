{{- /*
Migrations run once per release as a pre-upgrade hook, so replicas never race to
alter the same schema. The Deployment keeps Database__AutoMigrate false.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ssb.name" . }}-migrate
  labels:
    {{- include "ssb.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ssb.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "ssb.apiImage" . }}
          envFrom:
            - configMapRef:
                name: {{ include "ssb.name" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: Database__AutoMigrate
              value: "true"
            - name: RunMigrationsAndExit
              value: "true"
