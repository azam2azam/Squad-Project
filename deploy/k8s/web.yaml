apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: squad-status-board
  labels:
    app.kubernetes.io/name: squad-status-board
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squad-status-board
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: ghcr.io/azam2azam/squad-status-board-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: squad-status-board
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: squad-status-board
  namespace: squad-status-board
  annotations:
    # SignalR needs a long-lived connection; the default 60s read timeout would drop
    # the WebSocket and force the client into a reconnect loop.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - squad.pirt.example
      secretName: squad-status-board-tls
  rules:
    - host: squad.pirt.example
      http:
        paths:
          # nginx inside the web image already proxies /api and /hubs to the API
          # Service, so the Ingress only needs one backend. Routing them here as well
          # would be a second place to keep in step.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
