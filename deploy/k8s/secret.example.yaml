# TEMPLATE ONLY — do not apply as-is and never commit real values.
# Create it from the command line instead so secrets stay out of git:
#
#   kubectl -n squad-status-board create secret generic api-secrets \
#     --from-literal=ConnectionStrings__Default='Server=...;Database=SquadStatusBoard;...' \
#     --from-literal=Jwt__SigningKey="$(openssl rand -base64 48)"
#
# In a real cluster prefer an External Secrets Operator or sealed-secrets so the
# values are never in a manifest at all.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: squad-status-board
type: Opaque
stringData:
  ConnectionStrings__Default: "REPLACE_ME"
  Jwt__SigningKey: "REPLACE_ME_AT_LEAST_32_CHARACTERS"
