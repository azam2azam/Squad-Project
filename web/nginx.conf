server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Angular is a single-page app: every unknown path must return index.html so
    # deep links like /boards/{id} work on a hard refresh rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output is immutable; index.html must never be cached or clients
    # keep loading the previous deployment's chunk names.
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The API and SignalR hub are proxied so the browser makes same-origin requests
    # and CORS never enters the picture in a deployed environment.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        # Required for the WebSocket upgrade SignalR needs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
